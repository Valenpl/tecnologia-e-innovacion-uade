<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 430' width='940' height='430' font-family='Segoe UI, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Embudo de innovación cerrado vs abierto</title>
<rect width='940' height='430' fill='#ffffff' rx='12'/>
<defs><marker id='ar' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker>
<marker id='arb' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f6feb'/></marker>
<marker id='arr' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d1495b'/></marker>
<marker id='arg' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2a9d8f'/></marker></defs>
<text x='200' y='35' text-anchor='middle' font-size='16' font-weight='bold' fill='#333'>Innovación CERRADA (Wheelwright &amp; Clark, 1992)</text><path d='M30,70 L370,150' stroke='#0b3d91' stroke-width='4' fill='none' /><path d='M30,330 L370,250' stroke='#0b3d91' stroke-width='4' fill='none' /><rect x='370' y='150' width='0' height='100'/><circle cx='50' cy='120' r='9' fill='#4c9bf5'/><circle cx='70' cy='200' r='9' fill='#4c9bf5'/><circle cx='60' cy='270' r='9' fill='#4c9bf5'/><circle cx='130' cy='160' r='9' fill='#4c9bf5'/><circle cx='140' cy='240' r='9' fill='#4c9bf5'/><circle cx='210' cy='190' r='9' fill='#4c9bf5'/><circle cx='270' cy='210' r='9' fill='#4c9bf5'/><circle cx='310' cy='195' r='9' fill='#4c9bf5'/><text x='40' y='360' font-size='12' fill='#333'>Investigación</text><text x='180' y='360' font-size='12' fill='#333'>Desarrollo</text><text x='310' y='360' font-size='12' fill='#333'>Mercado</text><line x1='370' y1='200' x2='410' y2='200' stroke='#333' stroke-width='3' marker-end='url(#ar)'/><text x='200' y='395' text-anchor='middle' font-size='12' fill='#555'>Paredes sólidas: todo nace y muere adentro.</text><text x='200' y='412' text-anchor='middle' font-size='12' fill='#555'>Las ideas descartadas se archivan.</text><text x='660' y='35' text-anchor='middle' font-size='16' font-weight='bold' fill='#333'>Innovación ABIERTA (Chesbrough, 2003)</text><path d='M490,70 L830,150' stroke='#0b3d91' stroke-width='4' fill='none' stroke-dasharray='14 10'/><path d='M490,330 L830,250' stroke='#0b3d91' stroke-width='4' fill='none' stroke-dasharray='14 10'/><rect x='830' y='150' width='0' height='100'/><circle cx='510' cy='120' r='9' fill='#4c9bf5'/><circle cx='530' cy='200' r='9' fill='#4c9bf5'/><circle cx='520' cy='270' r='9' fill='#4c9bf5'/><circle cx='590' cy='160' r='9' fill='#4c9bf5'/><circle cx='600' cy='240' r='9' fill='#4c9bf5'/><circle cx='670' cy='190' r='9' fill='#4c9bf5'/><circle cx='730' cy='210' r='9' fill='#4c9bf5'/><circle cx='770' cy='195' r='9' fill='#4c9bf5'/><text x='500' y='360' font-size='12' fill='#333'>Investigación</text><text x='640' y='360' font-size='12' fill='#333'>Desarrollo</text><text x='770' y='360' font-size='12' fill='#333'>Mercado</text><line x1='830' y1='200' x2='870' y2='200' stroke='#333' stroke-width='3' marker-end='url(#ar)'/><line x1='500' y1='62' x2='560' y2='105' stroke='#2a9d8f' stroke-width='3' marker-end='url(#arg)'/><text x='480' y='56' font-size='12' fill='#2a9d8f' font-weight='bold'>Inbound: tecnología externa</text><line x1='700' y1='62' x2='690' y2='130' stroke='#2a9d8f' stroke-width='3' marker-end='url(#arg)'/><text x='660' y='56' font-size='11.5' fill='#2a9d8f'>(startups, universidades)</text><line x1='700' y1='272' x2='790' y2='310' stroke='#d1495b' stroke-width='3' marker-end='url(#arr)'/><text x='795' y='305' font-size='11.5' fill='#d1495b' font-weight='bold'>Outbound:</text><text x='795' y='320' font-size='11.5' fill='#d1495b' font-weight='bold'>licencias, spin-offs,</text><text x='795' y='335' font-size='11.5' fill='#d1495b' font-weight='bold'>joint ventures</text><text x='690' y='395' text-anchor='middle' font-size='12' fill='#555'>Paredes perforadas: el conocimiento entra y sale.</text><text x='690' y='412' text-anchor='middle' font-size='12' fill='#555'>Se llega al mercado propio… y a mercados ajenos.</text>
</svg>