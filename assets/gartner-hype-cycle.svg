<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 495' width='900' height='495' font-family='Segoe UI, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ciclo de expectativas tecnológicas (Gartner Hype Cycle)</title>
<rect width='900' height='495' fill='#ffffff' rx='12'/>
<defs><marker id='ar' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker>
<marker id='arb' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f6feb'/></marker>
<marker id='arr' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d1495b'/></marker>
<marker id='arg' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2a9d8f'/></marker></defs>
<line x1='70' y1='400' x2='880' y2='400' stroke='#333' stroke-width='2' marker-end='url(#ar)'/>
<line x1='70' y1='400' x2='70' y2='40' stroke='#333' stroke-width='2' marker-end='url(#ar)'/>
<text x='475.0' y='432' text-anchor='middle' font-size='14' fill='#333'>Tiempo</text>
<text x='36' y='220.0' text-anchor='middle' font-size='14' fill='#333' transform='rotate(-90 36 220.0)'>Expectativas (visibilidad)</text><path d='M90,385 C150,370 170,75 225,75 C285,75 285,330 345,330 C450,330 560,215 860,205' fill='none' stroke='#1f6feb' stroke-width='4'/><rect x='70' y='410' width='130' height='70' fill='#f1faee' stroke='#ccc'/><text x='135.0' y='432' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>Detonante de</text><text x='135.0' y='450' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>innovación</text><text x='135.0' y='468' text-anchor='middle' font-size='12' fill='#333'>(lanzamiento)</text><rect x='200' y='410' width='130' height='70' fill='#fff3e6' stroke='#ccc'/><text x='265.0' y='432' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>Pico de expectativas</text><text x='265.0' y='450' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>infladas /</text><text x='265.0' y='468' text-anchor='middle' font-size='12' fill='#333'>sobredimensionadas</text><rect x='330' y='410' width='120' height='70' fill='#fdecef' stroke='#ccc'/><text x='390.0' y='432' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>Abismo / punto</text><text x='390.0' y='450' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>mínimo de</text><text x='390.0' y='468' text-anchor='middle' font-size='12' fill='#333'>desilusión</text><rect x='450' y='410' width='210' height='70' fill='#eef7f6' stroke='#ccc'/><text x='555.0' y='432' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>Pendiente de</text><text x='555.0' y='450' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>iluminación</text><text x='555.0' y='468' text-anchor='middle' font-size='12' fill='#333'></text><rect x='660' y='410' width='220' height='70' fill='#eef4ff' stroke='#ccc'/><text x='770.0' y='432' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>Meseta de</text><text x='770.0' y='450' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#333'>productividad</text><text x='770.0' y='468' text-anchor='middle' font-size='12' fill='#333'></text><text x='150' y='372' font-size='11.5' fill='#555'>I+D · 1ª ronda de capital</text><text x='158' y='300' font-size='11.5' fill='#555'>1ª generación: precios altos,</text><text x='158' y='316' font-size='11.5' fill='#555'>mucha personalización</text><text x='232' y='60' font-size='11.5' fill='#555'>Sobrepromoción en medios · proliferación de proveedores</text><text x='300' y='200' font-size='11.5' fill='#555'>Prensa negativa · consolidación</text><text x='300' y='216' font-size='11.5' fill='#555'>y fracaso de proveedores</text><text x='330' y='355' font-size='11.5' fill='#555'>Adopción &lt; 5% del mercado · 2ª generación de productos</text><text x='520' y='300' font-size='11.5' fill='#555'>Mejores prácticas · 2ª/3ª ronda de capital</text><text x='560' y='180' font-size='11.5' fill='#555'>3ª generación · alta adopción (20–30% del mercado)</text><text x='140' y='30' text-anchor='middle' font-size='12' fill='#d1495b'>↑ en aumento</text><text x='225' y='30' text-anchor='middle' font-size='12' fill='#d1495b'>● en el pico</text><text x='335' y='30' text-anchor='middle' font-size='12' fill='#d1495b'>↓ descendiendo</text><text x='520' y='30' text-anchor='middle' font-size='12' fill='#d1495b'>↗ suben moderadamente</text><text x='780' y='30' text-anchor='middle' font-size='12' fill='#d1495b'>→ estables</text>
</svg>